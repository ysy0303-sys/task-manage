<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>专注计时器 · 番茄风</title>
    <!-- 引入字体：Inter 现代无衬线体 + 等宽数字 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- 引入 Font Awesome 图标库（用于按钮图标） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 主题系统 -->
    <script src="/js/theme.js"></script>
    <!-- 计时器专属样式 -->
    <link rel="stylesheet" href="css/timer.css?v=20260608c">
</head>
<body>
    <div class="timer-app">
        <!-- 主卡片 -->
        <div class="timer-card">
            <div style="text-align:left;margin-bottom:16px;">
                <a href="/index" style="color:var(--text-light);text-decoration:none;font-size:14px;">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
            </div>
            <!-- 模式切换标签 -->
<div class="mode-switch">
    <button class="mode-btn active" data-mode="stopwatch">正计时</button>
    <button class="mode-btn" data-mode="countdown">倒计时</button>
</div>
<div id="stopwatchPanel">
            <!-- 顶部：任务选择区（模拟关联任务） -->
            <div class="task-selector">
    <label for="stopwatchEvent" class="task-label">
        <i class="fas fa-tasks"></i> 做什么？
    </label>
    <input type="text" id="stopwatchEvent" placeholder="例如：写报告、修Bug" maxlength="100">
</div>

            <!-- 时间显示器（大数字，核心视觉） -->
            <div class="time-display-container">
                <div class="time-digits" id="timerDisplay">00:00</div>
                <div class="time-status" id="statusBadge">
                    <span class="status-dot"></span>
                    <span id="statusText">待开始</span>
                </div>
            </div>

            <!-- 进度环（纯装饰，体现"动态"感） -->
            <div class="progress-ring-container">
                <svg class="progress-ring" width="200" height="200" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="50%" stop-color="#818cf8"/>
                            <stop offset="100%" stop-color="#4f46e5"/>
                        </linearGradient>
                    </defs>
                    <circle class="progress-ring-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="progress-ring-fill" cx="100" cy="100" r="90" id="progressRing"></circle>
                </svg>
                <!-- 环中心显示今日累计（模拟） -->
                <div class="ring-center-text">
                    <span class="today-label">今日累计</span>
                    <span class="today-value" id="todayTotal">0h 0m</span>
                </div>
            </div>

            <!-- 控制按钮区 -->
            <div class="action-buttons">
                <button class="timer-btn btn-start" id="startBtn">
                    <i class="fas fa-play"></i> 开始
                </button>
                <button class="timer-btn btn-stop" id="stopBtn" disabled>
                    <i class="fas fa-stop"></i> 停止
                </button>
                <button class="timer-btn btn-reset" id="resetBtn" disabled>
                    <i class="fas fa-undo-alt"></i> 重置
                </button>
            </div>

            <!-- 本次计时结果卡片（停止后显示） -->
            <div class="session-summary" id="sessionSummary" style="display: none;">
                <div class="summary-header">
                    <i class="fas fa-check-circle"></i> 本次计时完成
                </div>
                <div class="summary-detail">
                    <div class="summary-item">
                        <span class="summary-label">任务</span>
                        <span class="summary-value" id="summaryTask">—</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">时长</span>
                        <span class="summary-value" id="summaryDuration">—</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">结束时间</span>
                        <span class="summary-value" id="summaryEndTime">—</span>
                    </div>
                </div>
            </div>
</div>
<!-- 倒计时面板 -->
<div id="countdownPanel" style="display: none;">
    <!-- 事件描述输入 -->
    <div class="countdown-event">
        <label for="countdownEvent">做什么？</label>
        <input type="text" id="countdownEvent" placeholder="例如：写作" maxlength="100">
    </div>

    <!-- 滚动选择器：时:分:秒 -->
    <div class="countdown-setter">
        <div class="scroll-picker-wrapper">
            <div class="scroll-picker-label">时</div>
            <div class="scroll-picker" id="pickerHours">
                <!-- JS 动态生成 00-23 -->
            </div>
        </div>
        <span class="time-sep">:</span>
        <div class="scroll-picker-wrapper">
            <div class="scroll-picker-label">分</div>
            <div class="scroll-picker" id="pickerMinutes">
                <!-- JS 动态生成 00-59 -->
            </div>
        </div>
        <span class="time-sep">:</span>
        <div class="scroll-picker-wrapper">
            <div class="scroll-picker-label">秒</div>
            <div class="scroll-picker" id="pickerSeconds">
                <!-- JS 动态生成 00-59 -->
            </div>
        </div>
        <!-- 隐藏字段，供 JS 读取 -->
        <input type="hidden" id="countdownHours" value="0">
        <input type="hidden" id="countdownMinutes" value="0">
        <input type="hidden" id="countdownSeconds" value="0">
    </div>

    <!-- 音效设置 -->
    <div class="sound-settings">
        <div class="sound-header">
            <span class="sound-title"><i class="fas fa-music"></i> 提醒音效</span>
            <button class="sound-test-btn" id="soundTestBtn" title="试听当前音效">
                <i class="fas fa-volume-up"></i> 试听
            </button>
        </div>
        <div class="sound-select-row">
            <select class="sound-select" id="soundSelect">
                <option value="beep">🔊 经典嘟嘟声</option>
                <option value="alarm">🚨 闹钟铃声</option>
                <option value="chime">🎐 风铃渐响</option>
                <option value="bell">🔔 钟声</option>
                <option value="digital">🎹 电子提示音</option>
                <option value="__custom__" class="custom-option">＋ 自定义添加...</option>
            </select>
        </div>
        <div class="saved-sounds-list" id="savedSoundsList"></div>

        <!-- 自定义音效编辑面板（内联，选「自定义添加」时展开） -->
        <div class="custom-sound-panel" id="customSoundPanel" style="display:none;">
            <div class="custom-panel-divider"></div>
            <div class="custom-panel-header">
                <span class="custom-panel-title">🎵 自定义音效</span>
                <button class="custom-panel-close" onclick="closeCustomPanel()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- 上传区（未选择文件时） -->
            <div class="custom-upload-zone" id="customUploadZone"
                 ondragover="event.preventDefault();this.classList.add('drag-over')"
                 ondragleave="this.classList.remove('drag-over')"
                 ondrop="event.preventDefault();this.classList.remove('drag-over');handleEditorDrop(event)">
                <i class="fas fa-cloud-upload-alt custom-upload-icon"></i>
                <div class="custom-upload-text">拖拽音频文件到此处，或点击下方按钮</div>
                <button class="custom-browse-btn" onclick="triggerEditorFileInput()">
                    <i class="fas fa-folder-open"></i> 选择音频文件
                </button>
                <div class="custom-upload-hint">支持 MP3 · WAV · OGG 格式，最大 50MB</div>
            </div>

            <!-- 编辑区（加载音频后显示） -->
            <div class="custom-editor-body" id="customEditorBody" style="display:none;">
                <canvas class="custom-waveform" id="audioWaveform"></canvas>
                <div class="custom-trim-bar-wrap">
                    <div class="custom-trim-bar-label">裁剪范围</div>
                    <div class="dual-range-wrapper">
                        <div class="dual-range">
                            <input type="range" id="trimStartSlider" min="0" max="100" value="0" oninput="onTrimSliderChange()">
                            <input type="range" id="trimEndSlider" min="0" max="100" value="100" oninput="onTrimSliderChange()">
                            <div class="dual-range-track"></div>
                            <div class="dual-range-fill" id="dualRangeFill"></div>
                        </div>
                    </div>
                    <div class="custom-trim-labels">
                        <span class="custom-trim-time" id="trimStartTime">0:00</span>
                        <span class="custom-trim-time" id="trimEndTime">0:00</span>
                    </div>
                </div>
                <div class="custom-editor-actions">
                    <button class="custom-play-btn" id="audioPreviewBtn" onclick="toggleTrimPreview()">
                        <i class="fas fa-play"></i>
                    </button>
                    <input type="text" id="audioCustomName" placeholder="音效名称..." maxlength="20">
                    <button class="custom-swap-btn" onclick="triggerEditorFileInput()" title="更换音频">
                        <i class="fas fa-exchange-alt"></i>
                    </button>
                </div>
                <div class="custom-editor-btns">
                    <button class="custom-btn-cancel" onclick="closeCustomPanel()">取消</button>
                    <button class="custom-btn-save" id="audioSaveBtn" onclick="saveTrimmedAudio()" disabled>
                        <i class="fas fa-check"></i> 保存音效
                    </button>
                </div>
            </div>
        </div>

        <!-- 隐藏的文件选择器 -->
        <input type="file" id="customSoundFile" accept="audio/*" style="display:none;">
    </div>

    <!-- 倒计时大数字显示 -->
    <div class="time-display-container">
        <div class="time-digits" id="countdownDisplay">00:00</div>
        <div class="time-status" id="countdownStatusBadge">
            <span class="status-dot"></span>
            <span id="countdownStatusText">待开始</span>
        </div>
    </div>

    <!-- 进度环（倒计时专用） -->
    <div class="progress-ring-container">
        <svg class="progress-ring" width="200" height="200" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#6366f1"/>
                    <stop offset="50%" stop-color="#818cf8"/>
                    <stop offset="100%" stop-color="#4f46e5"/>
                </linearGradient>
            </defs>
            <circle class="progress-ring-bg" cx="100" cy="100" r="90"></circle>
            <circle class="progress-ring-fill" cx="100" cy="100" r="90" id="countdownProgressRing"></circle>
        </svg>
        <div class="ring-center-text">
            <span class="today-label">目标</span>
            <span class="today-value" id="targetDurationLabel">25m</span>
        </div>
    </div>

    <!-- 控制按钮 -->
    <div class="action-buttons">
        <button class="timer-btn btn-start" id="countdownStartBtn">
            <i class="fas fa-play"></i> 开始
        </button>
        <button class="timer-btn btn-stop" id="countdownPauseBtn" disabled>
            <i class="fas fa-pause"></i> 暂停
        </button>
        <button class="timer-btn btn-reset" id="countdownResetBtn" disabled>
            <i class="fas fa-undo-alt"></i> 复位
        </button>
    </div>

    <!-- 本次倒计时摘要 -->
    <div class="session-summary" id="countdownSummary" style="display: none;">
        <div class="summary-header">
            <i class="fas fa-check-circle"></i> 倒计时完成
        </div>
        <div class="summary-detail">
            <div class="summary-item">
                <span class="summary-label">事件</span>
                <span class="summary-value" id="summaryCountdownEvent">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">设定时长</span>
                <span class="summary-value" id="summaryTargetDuration">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">实际用时</span>
                <span class="summary-value" id="summaryActualDuration">—</span>
            </div>
        </div>
    </div>
</div>
            <!-- 历史记录简表（内存中暂存，刷新即消失，满足“先不存库”） -->
            <div class="history-section">
                <div class="history-header">
                    <h3><i class="fas fa-history"></i> 本次会话记录</h3>
                    <button class="clear-history-btn" id="clearHistoryBtn" title="清空记录">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <div class="history-list" id="historyList">
                    <div class="history-empty">还没有计时记录，点击「开始」专注吧</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 计时器交互逻辑 -->
    <script src="js/timer.js?v=20260608d"></script>
</body>
</html>
