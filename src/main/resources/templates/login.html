<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}
body {
    background: linear-gradient(135deg, #D6E8F5 0%, #B7D1E5 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.login-box {
    width: 420px;
    padding: 45px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}
.login-title {
    text-align: center;
    margin-bottom: 35px;
    color: #4A7C96;
    font-size: 32px;
}
.input-item {
    margin-bottom: 25px;
    position: relative;
}
.input-item label {
    font-size: 14px;
    font-weight: 600;
    color: #556B75;
    margin-bottom: 8px;
    display: block;
}
.input-item input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 10px;
    background-color: #F0F4F7;
    font-size: 15px;
    border: none;
    outline: none;
}
.login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #73A8C2, #6297B1);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(115,168,194,0.35);
}
.login-btn.loading {
    pointer-events: none;
    opacity: 0.7;
}
.error-tip {
    color: #E85D75;
    text-align: center;
    margin-top: 10px;
    height: 18px;
    font-size: 14px;
}
.shake {
    animation: shake 0.4s;
}
.register-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #88A9BB;
    text-decoration: none;
    font-size: 14px;
}
@keyframes shake {
    0%,100% { transform: translateX(0);}
    25% { transform: translateX(-5px);}
    75% { transform: translateX(5px);}
}
</style>
</head>
<body>
<div class="login-box" id="box">
    <h2 class="login-title">用户登录</h2>
    <div class="input-item">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="input-item">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button class="login-btn" id="loginBtn" onclick="login()">登录</button>
    <div class="error-tip" id="errorMsg"></div>
    <a href="register" class="register-link">没有账号？去注册</a>
</div>
<script>
async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    const box = document.getElementById('box');

    errorMsg.innerText = "";

    if (!username || !password) {
        errorMsg.innerText = "请输入账号和密码";
        shake();
        return;
    }

    btn.innerText = "登录中...";
    btn.classList.add("loading");

    try {
        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
        });
        const result = await res.json();

        if (result.success) {
            location.href = '/user/index';
            // location.href = '/user/list';
        } else {
            errorMsg.innerText = result.msg;
            shake();
        }
    } catch (err) {
        errorMsg.innerText = "服务器异常";
        shake();
    } finally {
        btn.innerText = "登录";
        btn.classList.remove("loading");
    }
}

function shake() {
    const box = document.getElementById('box');
    box.classList.add("shake");
    setTimeout(() => box.classList.remove("shake"), 400);
}
</script>
</body>
</html>
