<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题颜色</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/theme.js"></script>
    <style>
        :root {
            --primary: #73A8C2;
            --primary-dark: #5A8FA8;
            --primary-light: #E4F0F6;
            --bg: #EEF3F7;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border: #E8ECF1;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Microsoft Yahei', sans-serif;
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.15); z-index: 9; display: none;
        }
        .overlay.show { display: block; }

        /* ========== Sidebar ========== */
        .sidebar {
            position: fixed; top: 0; left: 0; width: 210px; height: 100vh;
            background: var(--card); z-index: 10;
            box-shadow: 2px 0 20px rgba(0,0,0,0.04);
            padding: 24px 18px; display: flex; flex-direction: column;
        }
        .sidebar-logo {
            font-size: 20px; font-weight: 700; color: var(--primary);
            text-align: center; margin-bottom: 28px; letter-spacing: -0.5px;
        }
        .menu-wrapper { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .add-btn {
            width: 48px; height: 48px; border-radius: 50%;
            border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; font-size: 24px; cursor: pointer; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(115,168,194,0.35);
            transition: all var(--transition);
        }
        .add-btn:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(115,168,194,0.45); }
        .menu-item {
            padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; color: var(--text); transition: all var(--transition);
            font-weight: 500;
        }
        .menu-item:hover { background: var(--primary-light); color: var(--primary); }
        .menu-item i { font-size: 16px; width: 22px; text-align: center; color: var(--text-light); }
        .menu-item:hover i { color: var(--primary); }
        .sidebar-footer {
            border-top: 1px solid var(--border); padding-top: 14px; margin-top: auto;
        }

        /* ========== Main ========== */
        .main {
            margin-left: 210px; height: 100vh;
            display: flex; flex-direction: column; padding: 20px 28px;
            overflow: hidden;
        }
        .top-bar {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 20px; flex-shrink: 0;
        }
        .menu-btn {
            font-size: 22px; color: var(--text); background: var(--card);
            border: none; width: 42px; height: 42px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: var(--shadow-sm);
        }
        .back-btn-icon {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--card); border: none; font-size: 18px;
            color: var(--text-light); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-sm); transition: all var(--transition);
        }
        .back-btn-icon:hover { color: var(--primary); background: var(--primary-light); }
        .page-title { font-size: 22px; font-weight: 700; }

        .content-area {
            flex: 1; overflow-y: auto; padding-right: 4px;
        }
        .content-area::-webkit-scrollbar { width: 5px; }
        .content-area::-webkit-scrollbar-thumb { background: #d0d8e0; border-radius: 10px; }

        .theme-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
        }
        .theme-item {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all var(--transition);
        }
        .theme-item:hover { border-color: var(--primary); box-shadow: var(--shadow); }
        .theme-item.active {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .theme-item.active .theme-name { color: var(--primary); font-weight: 600; }
        .theme-name { font-size: 15px; color: var(--text); font-weight: 500; }
        .color-preview { display: flex; gap: 6px; }
        .color-dot {
            width: 24px; height: 24px; border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .active-check {
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: none; align-items: center; justify-content: center;
            font-size: 10px; margin-left: 8px;
        }
        .theme-item.active .active-check { display: flex; }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.show { transform: translateX(0); }
            .main { margin-left: 0; padding: 14px; }
            .menu-btn { display: flex; }
            .theme-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="overlay" id="overlay" onclick="hideSidebar()"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">TaskFlow</div>
    <div class="menu-wrapper">
        <button class="add-btn" onclick="location.href='/'">+</button>
        <div class="menu-item" onclick="location.href='/index'"><i class="fa-solid fa-sun"></i> 今日待办</div>
        <div class="menu-item" onclick="location.href='/tasks'"><i class="fa-solid fa-list-check"></i> 待办事项</div>
        <div class="menu-item" onclick="location.href='/shitu'"><i class="fa-solid fa-calendar-days"></i> 任务视图</div>
        <div class="menu-item" onclick="location.href='/messages'"><i class="fa-solid fa-message"></i> 消息</div>
    </div>
    <div class="sidebar-footer">
        <div class="menu-item" onclick="location.href='/profile'"><i class="fa-solid fa-user"></i> 个人中心</div>
    </div>
</div>

<div class="main">
    <div class="top-bar">
        <div class="menu-btn" onclick="toggleSidebar()">☰</div>
        <button class="back-btn-icon" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="page-title">主题颜色</div>
    </div>

    <div class="content-area">
        <div class="theme-list" id="themeList"></div>
    </div>
</div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('show');
        document.getElementById('overlay').classList.toggle('show');
    }
    function hideSidebar() {
        document.getElementById('sidebar').classList.remove('show');
        document.getElementById('overlay').classList.remove('show');
    }

    // 动态生成主题列表（色点 = 真实分类颜色）
    const currentTheme = getCurrentTheme();
    const listEl = document.getElementById('themeList');
    let html = '';
    Object.entries(THEMES).forEach(([key, theme]) => {
        const activeClass = key === currentTheme ? ' active' : '';
        const dotsHtml = theme.catColors.map(c =>
            `<span class="color-dot" style="background-color:${c};"></span>`
        ).join('');
        html += `
            <div class="theme-item${activeClass}" data-theme="${key}">
                <span class="theme-name">${theme.name}</span>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div class="color-preview">${dotsHtml}</div>
                    <span class="active-check"><i class="fa-solid fa-check"></i></span>
                </div>
            </div>`;
    });
    listEl.innerHTML = html;

    // 点击切换主题
    listEl.addEventListener('click', (e) => {
        const item = e.target.closest('.theme-item');
        if (!item) return;
        document.querySelectorAll('.theme-item').forEach(t => t.classList.remove('active'));
        item.classList.add('active');
        applyTheme(item.dataset.theme);
    });
</script>
</body>
</html>
