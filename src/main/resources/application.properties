spring.application.name=task

# 服务端口（Railway 通过 PORT 环境变量指定，本地默认 8080）
server.port=${PORT:8080}

# MySQL 连接配置（优先使用 Railway 环境变量，本地回退到默认值）
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:task_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:030303}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true
spring.web.resources.chain.cache=true
spring.thymeleaf.cache=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=/data/uploads

# DeepSeek AI 配置（Railway 上设置 DEEPSEEK_API_KEY 环境变量）
deepseek.api.key=${DEEPSEEK_API_KEY:sk-55b02d06fe544e82825ad551ad754668}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.model=deepseek-chat
deepseek.api.max-tokens=2000